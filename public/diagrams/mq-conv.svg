<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 170" xmlns="http://www.w3.org/2000/svg" class="dg" font-family="Archivo, Arial, sans-serif"><defs><marker id="m6770" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#14191D"/></marker><marker id="m6770s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#14191D"/></marker></defs><rect x="6" y="14" width="204" height="58" rx="3" fill="#F2F4F3" stroke="#4B555C" stroke-width="1.2"/><text x="108.0" y="39.2" text-anchor="middle" style="font-family:Archivo,Arial,sans-serif;font-size:11.5px;font-weight:620" fill="#14191D">ADC reading</text><text x="108.0" y="53.2" text-anchor="middle" style="font-family:'Plex Mono',Menlo,monospace;font-size:9.4px" fill="#5B666D">0–1023 at pin A0</text><rect x="232" y="14" width="204" height="58" rx="3" fill="#F2F4F3" stroke="#4B555C" stroke-width="1.2"/><text x="334.0" y="39.2" text-anchor="middle" style="font-family:Archivo,Arial,sans-serif;font-size:11.5px;font-weight:620" fill="#14191D">Output voltage</text><text x="334.0" y="53.2" text-anchor="middle" style="font-family:'Plex Mono',Menlo,monospace;font-size:9.4px" fill="#5B666D">Vout = ADC × 5 / 1023</text><rect x="458" y="14" width="204" height="58" rx="3" fill="#F2F4F3" stroke="#4B555C" stroke-width="1.2"/><text x="560.0" y="39.2" text-anchor="middle" style="font-family:Archivo,Arial,sans-serif;font-size:11.5px;font-weight:620" fill="#14191D">Sensor resistance</text><text x="560.0" y="53.2" text-anchor="middle" style="font-family:'Plex Mono',Menlo,monospace;font-size:9.4px" fill="#5B666D">Rs = RL (5 − Vout) / Vout</text><rect x="119" y="96" width="204" height="58" rx="3" fill="#F2F4F3" stroke="#4B555C" stroke-width="1.2"/><text x="221.0" y="121.2" text-anchor="middle" style="font-family:Archivo,Arial,sans-serif;font-size:11.5px;font-weight:620" fill="#14191D">Resistance ratio</text><text x="221.0" y="135.2" text-anchor="middle" style="font-family:'Plex Mono',Menlo,monospace;font-size:9.4px" fill="#5B666D">Rs / R₀</text><rect x="345" y="96" width="204" height="58" rx="3" fill="#DCEBEE" stroke="#0E5A6B" stroke-width="1.2"/><text x="447.0" y="121.2" text-anchor="middle" style="font-family:Archivo,Arial,sans-serif;font-size:11.5px;font-weight:620" fill="#0E3E4A">Concentration</text><text x="447.0" y="135.2" text-anchor="middle" style="font-family:'Plex Mono',Menlo,monospace;font-size:9.4px" fill="#5B666D">ppm = a · (Rs / R₀)^b</text><path d="M210,43 L232,43" fill="none" stroke="#14191D" stroke-width="1.3" marker-end="url(#m6770)"/><path d="M436,43 L458,43" fill="none" stroke="#14191D" stroke-width="1.3" marker-end="url(#m6770)"/><path d="M560,72 L560,84 L221,84 L221,96" fill="none" stroke="#14191D" stroke-width="1.3" marker-end="url(#m6770)"/><path d="M323,125 L345,125" fill="none" stroke="#14191D" stroke-width="1.3" marker-end="url(#m6770)"/><text x="340" y="166" text-anchor="middle" style="font-family:Archivo,Arial,sans-serif;font-size:9px;font-weight:400" fill="#4B555C">a, b: gas-specific constants of the sensor&#x27;s characteristic curve (MQ135 library)</text></svg>